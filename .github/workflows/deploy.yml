name: Deploy

# After CI passes on main: build both images, push them to Artifact Registry,
# migrate the database with a Cloud Run job, then roll out the Cloud Run
# service. Authenticates with Workload Identity Federation — no keys stored in
# GitHub. Does nothing until infra/gcp/bootstrap.sh has set the GCP_* variables.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.GCP_PROJECT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/fantasy
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build + push the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ env.SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build + push the jobs image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: jobs
          push: true
          tags: ${{ env.REGISTRY }}/jobs:${{ env.SHA }}
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,mode=max,scope=jobs

      - name: Migrate the database
        run: |
          gcloud run jobs deploy fantasy-migrate --region "$REGION" --quiet \
            --image "$REGISTRY/jobs:$SHA" --args db,upgrade \
            --service-account "$RUNTIME_SA" \
            --set-secrets DATABASE_URL=fantasy-database-url:latest \
            --max-retries 0 --task-timeout 10m
          gcloud run jobs execute fantasy-migrate --region "$REGION" --wait --quiet

      - name: Deploy the app
        id: app
        run: |
          gcloud run deploy fantasy --region "$REGION" --quiet \
            --image "$REGISTRY/api:$SHA" \
            --service-account "$RUNTIME_SA" \
            --set-secrets "DATABASE_URL=fantasy-database-url:latest,SESSION_SECRET=fantasy-session-secret:latest,APP_PASSWORD_HASH=fantasy-app-password-hash:latest,WEB_CRYPTO_KEY=fantasy-web-crypto-key:latest" \
            --set-env-vars COOKIE_SECURE=1,DB_POOL_SIZE=3 \
            --allow-unauthenticated \
            --cpu 1 --memory 512Mi --cpu-boost \
            --min-instances 0 --max-instances 3 --concurrency 40 --timeout 60s
          echo "url=$(gcloud run services describe fantasy --region "$REGION" --format 'value(status.url)')" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 3 "${{ steps.app.outputs.url }}/api/health/ready"

      # Optional public, read-only demo on its own database (see docs/operations.md).
      - name: Deploy the demo
        if: vars.DEMO_ENABLED == 'true'
        run: |
          gcloud run jobs deploy fantasy-demo-seed --region "$REGION" --quiet \
            --image "$REGISTRY/jobs:$SHA" --command sh \
            --args=-c,"fantasy db upgrade && fantasy demo seed" \
            --service-account "$RUNTIME_SA" \
            --set-secrets DATABASE_URL=fantasy-demo-database-url:latest \
            --max-retries 0 --task-timeout 15m
          gcloud run jobs execute fantasy-demo-seed --region "$REGION" --wait --quiet
          gcloud run deploy fantasy-demo --region "$REGION" --quiet \
            --image "$REGISTRY/api:$SHA" \
            --service-account "$RUNTIME_SA" \
            --set-secrets "DATABASE_URL=fantasy-demo-database-url:latest,SESSION_SECRET=fantasy-session-secret:latest" \
            --set-env-vars DEMO_MODE=1,COOKIE_SECURE=1,DB_POOL_SIZE=2 \
            --allow-unauthenticated \
            --cpu 1 --memory 512Mi --cpu-boost \
            --min-instances 0 --max-instances 2 --concurrency 40 --timeout 60s
