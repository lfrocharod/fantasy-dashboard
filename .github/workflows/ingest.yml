name: ingest

# NOTE: UEFA's edge blocks datacenter IPs, so GitHub-hosted runners cannot reach
# the Fantasy feeds — every hosted run fails with a read timeout. Ingestion runs
# from your own machine instead (see ingest/run.sh and the README).
#
# This workflow is kept for one scenario only: a **self-hosted runner** on a
# residential connection (e.g. your laptop). It has no schedule and won't run
# unless you dispatch it manually AND have a self-hosted runner registered.

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Also scrape external xG/xA sources"
        type: boolean
        default: true
      matchday:
        description: "Force a matchday (blank = auto)"
        type: string
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  run:
    # Change to [self-hosted] once you've registered a runner on a home machine.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        working-directory: ingest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".$([ '${{ inputs.full }}' = 'true' ] && echo '[sources]')"
      - name: Ingest
        working-directory: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEB_CRYPTO_KEY: ${{ secrets.WEB_CRYPTO_KEY }}
          UEFA_COMP_ID: ${{ vars.UEFA_COMP_ID }}
          SOURCE_LEAGUES: ${{ vars.SOURCE_LEAGUES }}
          FBREF_SEASON: ${{ vars.FBREF_SEASON }}
        run: |
          ARGS=""
          [ "${{ inputs.full }}" = "true" ] || ARGS="--skip-sources"
          [ -n "${{ inputs.matchday }}" ] && ARGS="$ARGS --matchday ${{ inputs.matchday }}"
          python -m fantasy_ingest.run $ARGS
