name: CI

# Every push and pull request: commit subjects follow the convention, both
# halves are linted, type-checked and tested, the generated API client matches
# the backend, and both images build. Actions are pinned to commit SHAs (the tag
# is in the comment).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    # Conventional Commits (type(scope): summary). A pull request's title too:
    # squash-merging makes it the commit subject on main. See CONTRIBUTING.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9-]+\))?!?: [^ ]'
          if git cat-file -e "$BASE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BASE" "$HEAD"; then
            range="$BASE..$HEAD"
          else
            range="$HEAD~1..$HEAD"  # a new branch or a rewritten history: check the tip
          fi
          bad=$(git log --no-merges --format='%h %s' "$range" | grep -vE "^[0-9a-f]+ $pattern" || true)
          if [ -n "$TITLE" ] && ! printf '%s' "$TITLE" | grep -qE "$pattern"; then
            bad="${bad}${bad:+$'\n'}pull request title: $TITLE"
          fi
          if [ -n "$bad" ]; then
            echo "::error::Subjects must look like 'fix(ucl): what changed' — see CONTRIBUTING.md"
            echo "$bad"
            exit 1
          fi
          echo "commit subjects ok ($range)"

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # the migration + API tests create (and drop) their own databases here
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --frozen --extra jobs --extra ml
      - name: Lint
        run: uv run ruff check src tests
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -p no:warnings --cov=fantasy --cov-report=term:skip-covered

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: API client is generated from the current backend
        run: |
          uv run --project ../backend --frozen fantasy openapi > openapi.json
          npm run api
          git diff --exit-code -- openapi.json src/api/schema.d.ts \
            || { echo "::error::Run 'fantasy openapi > frontend/openapi.json && npm run api' and commit."; exit 1; }
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        target: [api, jobs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: ${{ matrix.target == 'api' }}
          tags: fantasy-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Smoke-test the API image
        if: matrix.target == 'api'
        run: |
          docker run -d --name api -p 8080:8080 \
            -e DATABASE_URL=postgresql://nobody@127.0.0.1:1/none -e DEMO_MODE=1 fantasy-api:ci
          ok=""
          for _ in $(seq 1 30); do curl -sf localhost:8080/api/health && ok=1 && break; sleep 1; done
          [ -n "$ok" ] || { docker logs api; exit 1; }
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          docker rm -f api
