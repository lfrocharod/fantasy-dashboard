[project]
name = "fantasy-ingest"
version = "0.1.0"
description = "UEFA Champions League Fantasy ingestion + projection engine"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pulp>=2.8",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "cryptography>=42",
]

[project.optional-dependencies]
# Heavy scraping stack — only needed for the external xG/xA source step.
sources = ["soccerdata>=1.8", "pandas>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fantasy_ingest"]
